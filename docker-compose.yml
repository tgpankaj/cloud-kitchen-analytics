version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: kitcheniq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitcheniq
      POSTGRES_PASSWORD: kitcheniq_dev_pw
      POSTGRES_DB: kitcheniq
    ports:
      - "5433:5432"
    volumes:
      - kitcheniq_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitcheniq -d kitcheniq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kitcheniq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kitcheniq:kitcheniq_dev_pw@postgres:5432/kitcheniq
      SECRET_KEY: change-me-in-production
      FLASK_ENV: production
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  kitcheniq_pgdata: