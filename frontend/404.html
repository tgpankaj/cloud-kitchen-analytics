<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Kitchen Analytics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #fff5f0 0%, #f9fafb 100%);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .error-page h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .error-page p {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-icon">🍽️</div>
        <div class="error-code">404</div>
        <h1>Oops! Page Not Found</h1>
        <p>
            The page you're looking for doesn't exist, or has been moved.
            Let's get you back to tracking your kitchen's profitability.
        </p>
        <div class="error-actions">
            <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
            <a href="index.html" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        // If user is logged in, redirect to dashboard; else to landing
        const token = localStorage.getItem('token');
        if (!token) {
            document.querySelector('.error-actions a:first-child').style.display = 'none';
        }
    </script>
    <script src="js/navbar.js"></script>
    <script src="js/mobile-nav.js"></script>
</body>
</html>
