<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f0"/>
      <stop offset="100%" stop-color="#ffe4d6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e55a2b"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Dashboard mockup -->
  <rect x="60" y="60" width="680" height="380" rx="16" fill="white" filter="url(#shadow)"/>
  
  <!-- Top bar -->
  <rect x="60" y="60" width="680" height="50" rx="16" fill="#f9fafb"/>
  <circle cx="90" cy="85" r="5" fill="#ef4444"/>
  <circle cx="110" cy="85" r="5" fill="#f59e0b"/>
  <circle cx="130" cy="85" r="5" fill="#22c55e"/>
  
  <!-- KPI cards row -->
  <rect x="85" y="130" width="150" height="80" rx="8" fill="#fff5f0" stroke="#ffd4be"/>
  <text x="105" y="155" font-family="Inter, sans-serif" font-size="10" fill="#6b7280" font-weight="600">TOTAL ORDERS</text>
  <text x="105" y="185" font-family="Inter, sans-serif" font-size="22" fill="#111827" font-weight="700">1,247</text>
  
  <rect x="250" y="130" width="150" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="270" y="155" font-family="Inter, sans-serif" font-size="10" fill="#6b7280" font-weight="600">NET REVENUE</text>
  <text x="270" y="185" font-family="Inter, sans-serif" font-size="22" fill="#22c55e" font-weight="700">₹2.58L</text>
  
  <rect x="415" y="130" width="150" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="435" y="155" font-family="Inter, sans-serif" font-size="10" fill="#6b7280" font-weight="600">AVG ORDER</text>
  <text x="435" y="185" font-family="Inter, sans-serif" font-size="22" fill="#111827" font-weight="700">₹276</text>
  
  <rect x="580" y="130" width="140" height="80" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="600" y="155" font-family="Inter, sans-serif" font-size="10" fill="#6b7280" font-weight="600">LATE RATE</text>
  <text x="600" y="185" font-family="Inter, sans-serif" font-size="22" fill="#ef4444" font-weight="700">12.4%</text>
  
  <!-- Chart area -->
  <rect x="85" y="230" width="310" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="100" y="255" font-family="Inter, sans-serif" font-size="11" fill="#374151" font-weight="600">📈 Revenue Trend</text>
  
  <!-- Chart bars -->
  <g transform="translate(105, 280)">
    <rect x="0" y="80" width="20" height="40" fill="url(#bar)" rx="2"/>
    <rect x="30" y="60" width="20" height="60" fill="url(#bar)" rx="2"/>
    <rect x="60" y="40" width="20" height="80" fill="url(#bar)" rx="2"/>
    <rect x="90" y="70" width="20" height="50" fill="url(#bar)" rx="2"/>
    <rect x="120" y="30" width="20" height="90" fill="url(#bar)" rx="2"/>
    <rect x="150" y="50" width="20" height="70" fill="url(#bar)" rx="2"/>
    <rect x="180" y="20" width="20" height="100" fill="url(#bar)" rx="2"/>
    <rect x="210" y="60" width="20" height="60" fill="url(#bar)" rx="2"/>
    <rect x="240" y="40" width="20" height="80" fill="url(#bar)" rx="2"/>
    <rect x="270" y="55" width="20" height="65" fill="url(#bar)" rx="2"/>
  </g>
  
  <!-- Right side: Platform split -->
  <rect x="415" y="230" width="305" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="430" y="255" font-family="Inter, sans-serif" font-size="11" fill="#374151" font-weight="600">📱 Platform Split</text>
  
  <!-- Doughnut chart -->
  <g transform="translate(490, 320)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#fc8019" stroke-width="28" stroke-dasharray="200 400" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#e23744" stroke-width="28" stroke-dasharray="140 400" stroke-dashoffset="-200" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#22c55e" stroke-width="28" stroke-dasharray="55 400" stroke-dashoffset="-340" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="35" fill="white"/>
    <text x="-15" y="5" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#111827">Total</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(580, 285)">
    <circle cx="0" cy="0" r="6" fill="#fc8019"/>
    <text x="12" y="4" font-family="Inter, sans-serif" font-size="10" fill="#374151">Swiggy 45%</text>
    
    <circle cx="0" cy="22" r="6" fill="#e23744"/>
    <text x="12" y="26" font-family="Inter, sans-serif" font-size="10" fill="#374151">Zomato 40%</text>
    
    <circle cx="0" cy="44" r="6" fill="#22c55e"/>
    <text x="12" y="48" font-family="Inter, sans-serif" font-size="10" fill="#374151">Direct 15%</text>
  </g>
  
  <!-- Floating elements (decorative) -->
  <g opacity="0.4">
    <circle cx="700" cy="100" r="30" fill="#ff6b35"/>
    <circle cx="100" cy="420" r="20" fill="#ff6b35"/>
  </g>
</svg>
